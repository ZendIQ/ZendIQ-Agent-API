<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>ZendIQ Agent Execution</title>
  <style>
    :root{--ink:#f7f7fb;--paper:#060608;--surface:#0d0d12;--line:#343442;--cyan:#00e5ff;--blue:#7180ff;--purple:#b85cff;--green:#42f5a7;--amber:#ffc266;--red:#ff746c;--muted:#c1c5d2}
    *{box-sizing:border-box}body{margin:0;background-color:var(--paper);background-image:linear-gradient(rgba(113,128,255,.045) 1px,transparent 1px),linear-gradient(90deg,rgba(0,229,255,.035) 1px,transparent 1px);background-size:28px 28px;color:var(--ink);font-family:Georgia,'Times New Roman',serif;min-height:100vh}
    main{width:min(1180px,94vw);margin:auto;padding:32px 0 40px}.top{display:flex;justify-content:space-between;align-items:flex-end;border-bottom:2px solid var(--ink);padding-bottom:16px}
    .brand{font:800 42px/1 Arial,sans-serif;letter-spacing:0;background:linear-gradient(90deg,var(--ink) 0 58%,var(--cyan) 72%,var(--purple));background-clip:text;-webkit-background-clip:text;color:transparent}.kicker{font:700 12px/1 Arial,sans-serif;text-transform:uppercase;letter-spacing:1.8px;color:var(--cyan);margin-bottom:8px}
    .live{font:700 12px/1 Arial,sans-serif;text-transform:uppercase;display:flex;align-items:center;gap:8px;color:var(--muted)}.dot{width:9px;height:9px;border-radius:50%;background:var(--amber)}.connected{color:var(--ink)}.connected .dot{background:var(--cyan);box-shadow:0 0 0 5px rgba(0,229,255,.16)}
    .request{display:grid;grid-template-columns:minmax(0,1fr) minmax(240px,560px);gap:20px;align-items:center;padding:22px 0;border-bottom:1px solid var(--line)}.pair{font:800 30px/1 Arial,sans-serif}.mint{min-width:0;font:13px/1.4 Consolas,monospace;color:var(--muted);overflow-wrap:anywhere;text-align:right}
    .lanes{display:grid;grid-template-columns:1fr 1fr;border-bottom:1px solid var(--line)}.lane{padding:26px 28px 30px 0;min-height:390px}.lane+ .lane{border-left:1px solid var(--line);padding-left:28px;padding-right:0}
    .lane h2{font:800 18px/1 Arial,sans-serif;margin:0 0 22px;display:flex;justify-content:space-between}.lane[data-lane="mcp"] h2{color:var(--cyan)}.lane[data-lane="http"] h2{color:var(--purple)}.transport{color:var(--muted);font:700 11px/1 Arial,sans-serif;text-transform:uppercase;letter-spacing:1px}
    .steps{display:grid;gap:12px}.step{display:grid;grid-template-columns:28px 1fr auto;gap:12px;align-items:center;padding:13px 0;border-bottom:1px solid var(--line);opacity:.55;transform:translateY(6px);transition:.35s ease}.step.on{opacity:1;transform:none}.num{font:700 12px Arial,sans-serif;color:#aeb4c6}.label{font:700 15px Arial,sans-serif;color:var(--ink)}.value{font:700 13px Consolas,monospace;color:var(--cyan)}
    .result{display:none;margin-top:22px;border-left:5px solid var(--blue);padding:4px 0 4px 16px}.result.on{display:block;animation:rise .45s ease}.result.safe{border-color:var(--green)}.result.protect{border-color:var(--amber)}.result.refuse{border-color:var(--red)}.score{font:800 58px/1 Arial,sans-serif}.verdict{font:800 18px/1 Arial,sans-serif;text-transform:uppercase;color:var(--blue)}.safe .verdict{color:var(--green)}.protect .verdict{color:var(--amber)}.refuse .verdict{color:var(--red)}
    .proof{padding:24px 0;display:grid;grid-template-columns:1fr 1fr 1fr;gap:28px}.proof-label{font:700 11px Arial,sans-serif;text-transform:uppercase;color:var(--muted);letter-spacing:1px}.proof-value{font:700 18px/1.4 Consolas,monospace;margin-top:7px;overflow-wrap:anywhere;color:var(--ink)}.match{color:var(--green)}
    .waiting{color:var(--muted)}.error{color:var(--red)}@keyframes rise{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:none}}
    @media(max-width:760px){main{padding-top:22px}.brand{font-size:31px}.lanes,.proof{grid-template-columns:1fr}.lane+ .lane{border-left:0;border-top:1px solid var(--line);padding-left:0}.request{grid-template-columns:1fr}.mint{text-align:left}.lane{min-height:0}}
  </style>
</head>
<body>
<main>
  <header class="top"><div><div class="kicker">Agentic execution infrastructure</div><div class="brand">ZendIQ</div></div><div id="live" class="live"><span class="dot"></span><span>Connecting</span></div></header>
  <section class="request"><div><div class="kicker">Live request</div><div class="pair">SOL → TOKEN</div></div><div id="mint" class="mint">Waiting for an agent call…</div></section>
  <section class="lanes">
    <div class="lane" data-lane="mcp"><h2>MCP <span class="transport">Agent tool</span></h2><div class="steps"></div><div class="result"><div class="score">–</div><div class="verdict">Waiting</div></div></div>
    <div class="lane" data-lane="http"><h2>x402 <span class="transport">Open payment rail</span></h2><div class="steps"></div><div class="result"><div class="score">–</div><div class="verdict">Waiting</div></div></div>
  </section>
  <section class="proof"><div><div class="proof-label">Evidence match</div><div id="match" class="proof-value waiting">Awaiting both calls</div></div><div><div class="proof-label">Fingerprint</div><div id="fingerprint" class="proof-value">—</div></div><div><div class="proof-label">Coverage</div><div id="coverage" class="proof-value">—</div></div></section>
</main>
<script>
  const labels={call_started:'Request received',payment_required:'402 · payment required',payment_signed:'USDC authorization signed',payment_settled:'Payment settled',analysis_completed:'Analysis returned',call_failed:'Call failed'};
  const state={mcp:{},http:{}};
  function lane(name){return document.querySelector(`[data-lane="${name}"]`)}
  function addStep(name,event){const root=lane(name);if(!root||!labels[event.type])return;const index=root.querySelectorAll('.step').length;const row=document.createElement('div');row.className='step';const detail=event.type==='payment_required'&&event.data.priceUsd!=null?`$${Number(event.data.priceUsd).toFixed(2)} USDC`:event.type==='analysis_completed'?`${event.data.latencyMs} ms`:'';row.innerHTML=`<span class="num">${String(index+1).padStart(2,'0')}</span><span class="label">${labels[event.type]}</span><span class="value">${detail}</span>`;root.querySelector('.steps').append(row);setTimeout(()=>row.classList.add('on'),20+index*45)}
  function reset(){for(const name of ['mcp','http']){lane(name).querySelector('.steps').innerHTML='';lane(name).querySelector('.result').className='result'}document.getElementById('match').className='proof-value waiting';document.getElementById('match').textContent='Awaiting both calls';document.getElementById('fingerprint').textContent='—';document.getElementById('coverage').textContent='—'}
  const source=new EventSource('/events');source.onopen=()=>{const el=document.getElementById('live');el.classList.add('connected');el.lastElementChild.textContent='Live events'};
  source.onmessage=({data})=>{const event=JSON.parse(data);if(event.type==='reset')return reset();if(event.transport==='mcp'||event.transport==='http'){addStep(event.transport,event);if(event.type==='call_started')document.getElementById('mint').textContent=event.data.outputMint;if(event.type==='analysis_completed'){state[event.transport]=event.data;const root=lane(event.transport),result=root.querySelector('.result'),verdict=(event.data.verdict??'Unavailable');result.querySelector('.score').textContent=event.data.score??'—';result.querySelector('.verdict').textContent=verdict;result.className=`result on ${verdict.toLowerCase()}`;document.getElementById('coverage').textContent=event.data.signalsResolved??'—'}}if(event.type==='comparison_completed'){const match=document.getElementById('match');match.textContent=event.data.sameEvidence?'Verified · identical evidence':'Mismatch detected';match.className=`proof-value ${event.data.sameEvidence?'match':'error'}`;document.getElementById('fingerprint').textContent=event.data.evidenceFingerprint??'—'}};
</script>
</body>
</html>
